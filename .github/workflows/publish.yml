name: Publish

on:
  push:
    tags: ['v*']

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # The `secrets` context is not available in a job-level `if`, so the token
      # is lifted into `env` here and the publish step guards on that instead.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
      - name: No npm token yet
        if: env.NPM_TOKEN == ''
        run: |
          echo "NPM_TOKEN is not set, so nothing was published."
          echo "Consumers install this tag straight from git, so the release is still usable."
