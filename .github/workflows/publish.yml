name: Publish

on:
  push:
    tags: ['v*']

jobs:
  npm:
    runs-on: ubuntu-latest
    # Skipped until an NPM_TOKEN is added. Consumers install from the git tag
    # in the meantime, so a missing token is a no-op rather than a broken release.
    if: ${{ secrets.NPM_TOKEN != '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
