name: Publish

on:
  push:
    tags: ['v*']

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the runner mint an OIDC token, which is what npm exchanges for
      # publish rights under trusted publishing. No secret involved.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0. Node 20
          # ships npm 10, which silently falls back to token auth.
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # No NODE_AUTH_TOKEN. The npm CLI detects the OIDC environment and
      # authenticates against the trusted publisher configured on npmjs.com for
      # this repo + workflow file.
      - run: npm publish --access public
